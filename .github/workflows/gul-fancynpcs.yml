name: FancyNpcs (gul)

on:
  push:
    branches:
      - gul
    tags:
      - fancynpcs-gul-v*
  workflow_dispatch:

concurrency:
  group: gul-fancynpcs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Modify gradlew permissions
        run: chmod +x ./gradlew

      - name: Build FancyNpcs v2
        run: ./gradlew :plugins:fancynpcs-v2:shadowJar --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FancyNpcs
          path: plugins/fancynpcs-v2/build/libs/FancyNpcs-*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/fancynpcs-gul-v')
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: FancyNpcs
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
